<body>
<div id="root"></div>
<template id="tpl">

<div style="min-height: 100vh; box-sizing: border-box; padding: 24px 16px 40px; background: #E7EBEF; color: #14243A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
<main style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">

<header style="background: #33475C; color: #F1F3F5; border-radius: 30px; padding: clamp(26px, 7vw, 40px) clamp(20px, 6vw, 44px) clamp(24px, 6vw, 36px); display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #A9BED3">PORTFOLIO · 2026</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-family: 'Outfit', sans-serif; font-size: clamp(33px, 9vw, 46px); line-height: 1.03; font-weight: 600; letter-spacing: -0.03em">Segundo Perez Alisedo</p>
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 30px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; color: #A9BED3">Consultor de marketing</h1>
</div>
<p style="margin: 0; max-width: 660px; font-size: 17px; line-height: 1.5; font-weight: 500; text-wrap: pretty">Ayudo a negocios a crecer, entendiendo su mercado, su competencia y sus clientes.</p>
<p style="margin: 0; max-width: 660px; font-size: 14px; line-height: 1.5; color: #C5D0DB">Más de 8 años en agencias de medios y marketing, con marcas de e&#8209;commerce, retail, consumo masivo, telecomunicaciones y más.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="https://calendar.app.google/XgHgMxgmJREybVak9" style="min-height: 44px; display: flex; align-items: center; padding: 0 18px; border-radius: 999px; background: #A9BED3; color: #14243A; font-size: 14px; font-weight: 700; text-decoration: none">Agendá una charla</a>
<a href="https://wa.me/5492324592405?text=Hola%20Segundo%2C%20vi%20tu%20portfolio%20y%20quiero%20contarte%20sobre%20mi%20negocio." style="min-height: 44px; display: flex; align-items: center; padding: 0 18px; border-radius: 999px; border: 1.5px solid #8095AC; color: #F1F3F5; font-size: 14px; font-weight: 600; text-decoration: none">Escribime por WhatsApp</a>
</div>
</header>

<section aria-label="Servicios" style="order: 2; background: #FFFFFF; border-radius: 30px; padding: 32px clamp(18px, 5vw, 40px); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Servicios</h2>
<p style="margin: 0; font-size: 14px; color: #4D6079">Elegí uno o armamos un paquete que combine varios, según lo que necesites.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
<div style="background: #F1F3F5; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Estrategia</h3>
<p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #4D6079">Investigo tu negocio, el mercado y la competencia para definir el rumbo.</p>
<p style="margin: 4px 0 0; font-size: 12.5px; line-height: 1.4; color: #33475C"><strong>Lo hice para:</strong> Aike Drones · SVB Suipacha</p>
</div>
<div style="background: #F1F3F5; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Medios y publicidad</h3>
<p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #4D6079">Digitales y tradicionales, con o sin pauta paga.</p>
<p style="margin: 4px 0 0; font-size: 12.5px; line-height: 1.4; color: #33475C"><strong>Lo hice para:</strong> Aike Drones (plan definido)</p>
</div>
<div style="background: #F1F3F5; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Contenido y redes</h3>
<p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #4D6079">Ideas de contenido, fotos y gestión de redes.</p>
<p style="margin: 4px 0 0; font-size: 12.5px; line-height: 1.4; color: #33475C"><strong>Lo hice para:</strong> Aike Drones · SVB Suipacha</p>
</div>
<div style="background: #F1F3F5; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Marca y comunicación</h3>
<p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #4D6079">Posicionamiento y un mensaje coherente en todos tus canales.</p>
<p style="margin: 4px 0 0; font-size: 12.5px; line-height: 1.4; color: #33475C"><strong>Lo hice para:</strong> Aike Drones · SVB Suipacha</p>
</div>
<div style="background: #F1F3F5; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Ventas</h3>
<p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #4D6079">Proceso comercial, seguimiento de clientes y capacitación.</p>
<p style="margin: 4px 0 0; font-size: 12.5px; line-height: 1.4; color: #33475C"><strong>Lo hice para:</strong> Aike Drones</p>
</div>
<div style="background: #F1F3F5; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Sitio web</h3>
<p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #4D6079">Armo webs simples o coordino al equipo que haga una más completa.</p>
<p style="margin: 4px 0 0; font-size: 12.5px; line-height: 1.4; color: #33475C"><strong>Lo hice para:</strong> Aike Drones (en desarrollo)</p>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px">
<div style="background: #33475C; color: #F1F3F5; border-radius: 22px; padding: 20px 22px; display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Decisiones basadas en datos</h3>
<p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #DCE3EA">Mido cada acción y ajusto la estrategia según los resultados: manda lo que funciona, no lo que más me gusta.</p>
</div>
<div style="background: #33475C; color: #F1F3F5; border-radius: 22px; padding: 20px 22px; display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">A la medida de tu negocio y de tu presupuesto</h3>
<p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #DCE3EA">Primero entiendo tu negocio, tus objetivos y tus posibilidades. Después armamos juntos la propuesta. ¿Sin presupuesto para publicidad? Crecemos con contenido, redes y ventas.</p>
</div>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 8px 0">
<h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">El trabajo</h2>
<p style="margin: 0; font-size: 14px; color: #4D6079">Elegí un cliente para ver qué hice en cada servicio y parte del contenido.</p>
</div>

<nav aria-label="Clientes" style="display: flex; flex-wrap: wrap; gap: 12px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="flex: 1 1 320px; min-width: 0; min-height: 44px; display: flex; gap: 16px; align-items: center; text-align: left; padding: 16px 20px; border-radius: 24px; border: 2px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; cursor: pointer">
<span style="flex: none; width: 60px; height: 60px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; overflow: hidden">
<img src="{{t.logo}}" alt="" style="width: {{t.logoSize}}; height: {{t.logoSize}}; object-fit: contain">
</span>
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 600; line-height: 1.15">{{t.cliente}}</span>
<span style="font-size: 13.5px; line-height: 1.4; color: {{t.sub}}">{{t.rubro}}</span>
</span>
</button>
</sc-for>
</nav>
